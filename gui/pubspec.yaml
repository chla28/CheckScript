name: check_script_gui
description: Interface graphique de check-script (évaluation de scripts shell et Python).
publish_to: 'none'
version: 0.18.3+27

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  check_script:
    path: ../
  file_picker: ^11.0.3
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  desktop_drop: ^0.7.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Police du code (variante sans ligatures), licence OFL 1.1 : sa licence
  # accompagne la police dans chaque paquet (flutter_assets).
  assets:
    - fonts/JetBrainsMono/OFL.txt
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono/JetBrainsMonoNL-Regular.ttf
        - asset: fonts/JetBrainsMono/JetBrainsMonoNL-Bold.ttf
          weight: 700
        - asset: fonts/JetBrainsMono/JetBrainsMonoNL-Italic.ttf
          style: italic
        - asset: fonts/JetBrainsMono/JetBrainsMonoNL-BoldItalic.ttf
          weight: 700
          style: italic
