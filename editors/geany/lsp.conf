# CheckScript for Geany (2.1 or later) with the "LSP Client" plugin
# (package geany-plugins-lsp, or geany-plugins): Tools → LSP Client →
# User configuration, then paste the sections you want.
#
# A file type has only one LSP server in Geany: for Python, CheckScript
# then replaces pyright or pylsp (diagnostics, hover, fixes,
# formatting; no completion).

[all]
# Explanations and fix examples on hover.
hover_enable=true

[Sh]
cmd=check-script lsp
use_without_project=true
use_outside_project_dir=true

[Python]
cmd=check-script lsp
use_without_project=true
use_outside_project_dir=true

[Dockerfile]
cmd=check-script lsp
use_without_project=true
use_outside_project_dir=true

[Make]
cmd=check-script lsp
use_without_project=true
use_outside_project_dir=true

# GitHub Actions workflows, GitLab CI, Ansible tasks (other YAML files
# are ignored by CheckScript).
[YAML]
cmd=check-script lsp
use_without_project=true
use_outside_project_dir=true
