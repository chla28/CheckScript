# CheckScript pour Geany (2.1 ou plus récent) avec le greffon « LSP Client »
# (paquet geany-plugins-lsp, ou geany-plugins) : Outils → LSP Client →
# Configuration utilisateur, puis coller les sections voulues.
#
# Un type de fichier n'a qu'un serveur LSP dans Geany : pour Python, CheckScript
# remplace alors pyright ou pylsp (diagnostics, survol, corrections,
# formatage ; pas de complétion).

[all]
# Explications et exemples de correction au survol.
hover_enable=true

[Sh]
cmd=check-script lsp
use_without_project=true
use_outside_project_dir=true

[Python]
cmd=check-script lsp
use_without_project=true
use_outside_project_dir=true

[Dockerfile]
cmd=check-script lsp
use_without_project=true
use_outside_project_dir=true

[Make]
cmd=check-script lsp
use_without_project=true
use_outside_project_dir=true

# Workflows GitHub Actions, GitLab CI, tâches Ansible (les autres fichiers
# YAML sont ignorés par CheckScript).
[YAML]
cmd=check-script lsp
use_without_project=true
use_outside_project_dir=true
