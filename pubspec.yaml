name: check_script
description: >-
  Evaluates a shell script (Security, Robustness, Maintainability,
  Portability, Performance) using shellcheck, shfmt, bashate, checkbashisms
  and built-in rules.
version: 0.20.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  args: ^2.6.0
  path: ^1.9.0
  pdf: ^3.12.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0

executables:
  check-script: check_script
