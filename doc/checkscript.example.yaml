# check-script configuration example.
#
# Locations read (the first one found):
#   1. --config FILE
#   2. ./.checkscript.yaml
#   3. ${XDG_CONFIG_HOME:-~/.config}/check-script/config.yaml
# All keys are optional: a missing key keeps the profile's value.

profile: default                # strict | default | legacy (--profile takes precedence)
context: []                     # [root, cron, systemd] : dedicated rules and severities
followSource: false             # shellcheck -x (sourced files)
pythonTarget: "3.9"             # minimum Python to support (quoted)

tools:
  shellcheck:
    enabled: true
    path: shellcheck            # name in PATH or absolute path
    exclude: [SC1091]           # passed to shellcheck --exclude
  shfmt:
    enabled: true
  bashate:
    enabled: true
    exclude: [E006]             # passed to bashate --ignore
  checkbashisms: true           # short form: enabled / disabled
  gitleaks: true                # secrets (if installed)
  trufflehog: true              # secrets, without network verification (if installed)
  syntax: true                  # bash -n / sh -n / Python compilation check
  builtin: true                 # built-in rules
  # ── Python scripts ──
  ruff:
    exclude: [PLR2004, S603]    # passed to ruff --ignore
  bandit:
    exclude: [B404, B603]       # passed to bandit -s
  semgrep:
    enabled: true
    # Rules: p/python by default (downloaded, cached for one
    # week); on an isolated machine, a local file or folder.
    # config: /opt/regles/python.yml
  mypy: true
  radon: true                   # complexity, maintainability index
  vermin: true                  # minimum Python version required
  pylint: false                 # redundant with ruff (can be enabled)
  pyright: false                # redundant with mypy (can be enabled)

rules:
  # Ignored rules, regardless of tool (SCxxxx, Exxx, SECxxx…).
  disabled: [MNT005]
  # Reclassification of a rule (category and/or severity).
  overrides:
    SC2086: { category: security, severity: medium }

scoring:
  weights: { critical: 4, high: 2, medium: 0.75, low: 0.25 }
  referenceLines: 100           # beyond that, Medium/Low are attenuated (√(100/n))
  categoryWeights:              # weight in the overall score
    security: 1.5
    robustness: 1.25
    maintainability: 1
    portability: 0.75
    performance: 0.5

thresholds:
  maxLineLength: 120            # MNT001 (and bashate --max-line-length)
  maxFunctionLines: 60          # MNT002 (Medium beyond double)
  maxNesting: 4                 # MNT003
  maxLinesWithoutFunction: 150  # MNT008
