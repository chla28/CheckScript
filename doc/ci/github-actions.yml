# Exemple de workflow GitHub Actions : les résultats SARIF apparaissent dans
# l'onglet « Security → Code scanning » du dépôt.
name: check-script
on: [push, pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  check-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils d'analyse
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt devscripts
          pip install bashate
      - name: check-script
        run: |
          curl -fsSL "${{ vars.CHECK_SCRIPT_URL }}" | tar xz
          ./check_script-*/install.sh --prefix="$HOME/.local"
          check-script --no-color --summary -o check-script.sarif --fail-under 6 .
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: check-script.sarif
