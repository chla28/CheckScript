# Example GitHub Actions workflow using the CheckScript action: annotations
# on pull request lines, job summary, SARIF in the
# "Security → Code scanning" tab (free for public repositories).
name: check-script
on: [push, pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  check-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: cs
        uses: chla28/CheckScript@v0.19.2
        with:
          paths: .
          fail-under: '6'
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: check-script.sarif
