# Exemple de workflow GitHub Actions avec l'action CheckScript : annotations
# sur les lignes des pull requests, résumé du job, SARIF dans l'onglet
# « Security → Code scanning » (gratuit pour les dépôts publics).
name: check-script
on: [push, pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  check-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cs
        uses: chla28/CheckScript@v0.14.0
        with:
          paths: .
          fail-under: '6'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: check-script.sarif
