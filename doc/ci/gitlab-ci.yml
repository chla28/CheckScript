# Example GitLab CI job for check-script.
#
# - The Code Quality report is shown in the merge request widget.
# - The HTML report is kept as an artifact.
# - The job fails if a script scores below 6/10, or below 8/10 in security.
#
# Variable to define: CHECK_SCRIPT_URL (URL of the archive
# check_script-VERSION-linux-x86_64.tar.gz, e.g. a GitLab package registry).

check-script:
  stage: test
  image: registry.fedoraproject.org/fedora:44
  before_script:
    - dnf install -y --setopt=install_weak_deps=False ShellCheck shfmt
      devscripts-checkbashisms python3-pip tar curl
    - pip install --quiet bashate
    - curl -fsSL "$CHECK_SCRIPT_URL" | tar xz
    - ./check_script-*/install.sh --prefix=/usr/local
  script:
    - check-script --no-color --summary
      -o gl-code-quality-report.json
      -o check-script.html
      --fail-under 6 --fail-under security=8
      .
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - check-script.html
  rules:
    - changes:
        - "**/*.sh"
        - "**/*.bash"

# "New issues only" variant (existing debt tolerated):
# keep a baseline JSON report on the main branch, then
#   check-script -b reference.json --fail-on-new high -o gl-code-quality-report.json .
