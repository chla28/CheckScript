# L'action CheckScript appliquée au dépôt lui-même (scripts, workflows,
# empaquetage) : vérifie que l'action fonctionne et annote les pull requests.
name: Auto-analyse

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cs
        # Action du dépôt (à la racine : la syntaxe $/ ne le permet pas
        # encore de façon documentée).
        uses: ./ # zizmor: ignore[self-repository]
        with:
          paths: scripts packaging .github .githooks
          sarif: ''
      - name: Résultat
        env:
          SCORE: ${{ steps.cs.outputs.score }}
          GRADE: ${{ steps.cs.outputs.grade }}
          SCRIPTS: ${{ steps.cs.outputs.scripts }}
        run: echo "$SCRIPTS script(s), note moyenne $SCORE, plus bas niveau $GRADE"
