# L'action CheckScript appliquée au dépôt lui-même (scripts, workflows,
# empaquetage) : vérifie que l'action fonctionne et annote les pull requests.
name: Auto-analyse

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: cs
        uses: ./
        with:
          paths: scripts packaging .github .githooks
          sarif: ''
      - name: Résultat
        env:
          SCORE: ${{ steps.cs.outputs.score }}
          GRADE: ${{ steps.cs.outputs.grade }}
          SCRIPTS: ${{ steps.cs.outputs.scripts }}
        run: echo "$SCRIPTS script(s), note moyenne $SCORE, plus bas niveau $GRADE"
