# Publication : à chaque tag vX.Y.Z (ou à la demande), tests puis construction
# de l'archive, des RPM, de l'AppImage et du Flatpak, attachés à une release
# GitHub avec l'extrait du CHANGELOG.
#
# Les tests tournent sans outils d'analyse externes : ceux qui en dépendent
# (niveaux du corpus, intégration) sont ignorés, leurs résultats variant avec
# les versions d'outils des distributions.
name: Publication

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Les tests ne doivent pas dépendre de la langue du système : ils sont
      # joués en anglais (C.UTF-8, défaut du runner) puis en français.
      - name: Bibliothèque et CLI
        env:
          LANG: C.UTF-8
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib test bin tool
          dart analyze --fatal-infos
          dart test
      - name: Bibliothèque et CLI (locale française)
        env:
          LANG: fr_FR.UTF-8
        run: dart test
      - name: Interface
        working-directory: gui
        env:
          LANG: C.UTF-8
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Interface (locale française)
        working-directory: gui
        env:
          LANG: fr_FR.UTF-8
        run: flutter test

  linux:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dépendances de construction
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev asciidoctor flatpak flatpak-builder
      - name: Archive
        run: ./scripts/build-dist.sh --skip-tests
      - name: AppImage
        run: ./scripts/build-appimage.sh --skip-build
      - name: Flatpak
        run: ./scripts/build-flatpak.sh --skip-build
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.flatpak

  rpm:
    needs: tests
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Dépendances de construction
        run: |
          dnf install -y git rpm-build gtk3-devel cmake ninja-build clang \
            rubygem-asciidoctor unzip xz which findutils tar
      - uses: actions/checkout@v4
      - name: Flutter
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git /opt/flutter
          echo /opt/flutter/bin >> "$GITHUB_PATH"
      - name: RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          flutter --disable-analytics
          ./scripts/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/rpm/**/*.rpm

  release:
    needs: [linux, rpm]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Notes de version (CHANGELOG)
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## " v " " {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md > notes.md
          test -s notes.md || echo "Version $v" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: artifacts/**/*
