# Publication : à chaque tag vX.Y.Z (ou à la demande), tests puis construction
# de l'archive, des RPM, de l'AppImage et du Flatpak, attachés à une release
# GitHub avec l'extrait du CHANGELOG.
#
# Les tests tournent sans outils d'analyse externes : ceux qui en dépendent
# (niveaux du corpus, intégration) sont ignorés, leurs résultats variant avec
# les versions d'outils des distributions.
name: Publication

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Lecture seule par défaut ; seul le job release écrit (création de la
# release et envoi des fichiers).
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Les tests ne doivent pas dépendre de la langue du système : ils sont
      # joués en anglais (C.UTF-8, défaut du runner) puis en français.
      - name: Bibliothèque et CLI
        env:
          LANG: C.UTF-8
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib test bin tool
          dart analyze --fatal-infos
          dart test
      - name: Bibliothèque et CLI (locale française)
        env:
          LANG: fr_FR.UTF-8
        run: dart test
      - name: Interface
        working-directory: gui
        env:
          LANG: C.UTF-8
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Interface (locale française)
        working-directory: gui
        env:
          LANG: fr_FR.UTF-8
        run: flutter test

  linux:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dépendances de construction
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev asciidoctor flatpak flatpak-builder
      - name: Archive
        run: ./scripts/build-dist.sh --skip-tests
      - name: AppImage
        run: ./scripts/build-appimage.sh --skip-build
      - name: Flatpak
        run: ./scripts/build-flatpak.sh --skip-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.flatpak

  rpm:
    needs: tests
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Dépendances de construction
        run: |
          dnf install -y git rpm-build gtk3-devel cmake ninja-build clang \
            rubygem-asciidoctor unzip xz which findutils tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Flutter
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git /opt/flutter
          echo /opt/flutter/bin >> "$GITHUB_PATH"
      - name: RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          flutter --disable-analytics
          ./scripts/build-rpm.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm
          path: dist/rpm/**/*.rpm

  # Extensions d'éditeurs : VS Code (test de bout en bout dans un vrai
  # VS Code sous xvfb, puis .vsix) et Eclipse (site de mise à jour Tycho).
  editors:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # Pas de cache partagé entre exécutions (empoisonnement de cache).
          package-manager-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: check-script (serveur LSP des tests)
        run: |
          dart pub get
          dart compile exe bin/check_script.dart -o "$RUNNER_TEMP/check-script"
          sudo apt-get update
          sudo apt-get install -y shellcheck xvfb
      - name: VS Code
        working-directory: editors/vscode
        env:
          CHECK_SCRIPT: ${{ runner.temp }}/check-script
        run: |
          npm ci
          xvfb-run -a npm test
          npm run package
          mv check-script.vsix "../../check-script-${GITHUB_REF_NAME#v}.vsix"
      - name: Eclipse
        run: |
          cp LICENSE editors/eclipse/bundles/fr.chla28.checkscript/LICENSE
          mvn -B -f editors/eclipse/pom.xml verify
          cp editors/eclipse/sites/fr.chla28.checkscript.site/target/*.zip \
            "check-script-eclipse-${GITHUB_REF_NAME#v}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editors
          path: |
            check-script-*.vsix
            check-script-eclipse-*.zip

  release:
    needs: [linux, rpm, editors]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Notes de version (CHANGELOG)
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## " v " " {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md > notes.md
          test -s notes.md || echo "Version $v" > notes.md
      # gh est fourni par le runner : pas d'action tierce pour la release.
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -type f | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file notes.md "${files[@]}"
          fi
