# Hook pour le framework pre-commit (https://pre-commit.com) :
#
#   repos:
#     - repo: https://github.com/chla28/CheckScript
#       rev: v0.23.0
#       hooks:
#         - id: check-script
#           args: [--fail-under, "7"]
#
# check-script doit être installé sur le poste (language: system).
- id: check-script
  name: check-script
  description: Scores shell and Python scripts (security, robustness, maintainability…)
  entry: check-script --quiet --no-color --fail-under 6
  language: system
  types_or: [shell, python]
  require_serial: true
- id: check-script-fix
  name: check-script (automatic fixes)
  description: Applies check-script's safe fixes
  entry: check-script --quiet --fix
  language: system
  types_or: [shell, python]
  require_serial: true
